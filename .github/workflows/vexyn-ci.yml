name: Vexyn CI

on:
  push:
    branches:
      - main
      - rebrand/vexyn-core
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Test, lint, localize and build Vexyn APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Vexyn
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install project dependencies
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm run test

      - name: Biome quality checks
        run: npx biome ci .

      - name: Translation consistency check
        run: npm run lang check

      - name: Set up Cordova project and plugins
        run: npm run setup

      - name: Build Vexyn debug APK
        run: npm run build paid dev apk

      - name: Verify APK application ID
        shell: bash
        run: |
          set -euo pipefail
          APK="platforms/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.vexyn.devx'"

      - name: Upload Vexyn debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vexyn-debug-apk-${{ github.sha }}
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
