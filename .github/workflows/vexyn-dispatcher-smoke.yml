name: Vexyn Workflow Diagnostics

on:
  push:
    branches:
      - rebrand/vexyn-core

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Vexyn branch
        uses: actions/checkout@v4

      - name: Download actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
        shell: bash

      - name: Validate workflow syntax and expressions
        run: ./actionlint -color .github/workflows/vexyn-ci.yml
        shell: bash
